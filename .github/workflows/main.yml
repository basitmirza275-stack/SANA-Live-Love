name: Build SANA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir -p android-project
          unzip -oq "$ZIP_FILE" -d android-project
          find android-project -name gradlew -type f

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          WRAPPER=$(find android-project -name gradlew -type f -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          echo "GRADLE_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANA-debug-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
